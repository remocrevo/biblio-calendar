//increment only the month of the date
//- if date doesn't exist in new month (e.g. Feb 30), set to last day of the month
function addMonths(date, months) {
    var d = date.getDate();
    date.setMonth(date.getMonth() + +months);
    if (date.getDate() != d) {
      date.setDate(0);
    }
    return date;
}

function sort_age_groups(a, b) {

}


// Returns a function, that, when invoked, will only be triggered at most once
// during a given window of time. Normally, the throttled function will run
// as much as it can, without ever going more than once per `wait` duration;
// but if you'd like to disable the execution on the leading edge, pass
// `{leading: false}`. To disable execution on the trailing edge, ditto.
function throttle(func, wait, options) {
  var context, args, result;
  var timeout = null;
  var previous = 0;
  if (!options) options = {};
  var later = function() {
    previous = options.leading === false ? 0 : Date.now();
    timeout = null;
    result = func.apply(context, args);
    if (!timeout) context = args = null;
  };
  return function() {
    var now = Date.now();
    if (!previous && options.leading === false) previous = now;
    var remaining = wait - (now - previous);
    context = this;
    args = arguments;
    if (remaining <= 0 || remaining > wait) {
      if (timeout) {
        clearTimeout(timeout);
        timeout = null;
      }
      previous = now;
      result = func.apply(context, args);
      if (!timeout) context = args = null;
    } else if (!timeout && options.trailing !== false) {
      timeout = setTimeout(later, remaining);
    }
    return result;
  };
};


//const throttledRun = throttleAsync(fn, 1000);
//throttledRun(1); // Will execute immediately.
//throttledRun(2); // Will be delayed by 1 second.
//throttledRun(3); // Will be delayed by 2 second.
function throttleAsync(fn, wait) {
  let lastRun = 0;

  async function throttled(...args) {
    const currentWait = lastRun + wait - Date.now();
    const shouldRun = currentWait <= 0;

    if (shouldRun) {
      lastRun = Date.now();
      
      return await fn(...args);
    } else {
      return await new Promise(function(resolve) {
        setTimeout(function() {
          resolve(throttled(...args));
        }, currentWait);
      });
    }
  }

  return throttled;
}

function Export2Word(element, filename = ''){
    var preHtml = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>Export HTML To Doc</title></head><body>";
    var postHtml = "</body></html>";
    var html = preHtml+document.getElementById(element).innerHTML+postHtml;

    var blob = new Blob(['\ufeff', html], {
        type: 'application/msword'
    });
    
    // Specify link url
    var url = 'data:application/vnd.ms-word;charset=utf-8,' + encodeURIComponent(html);
    
    // Specify file name
    filename = filename?filename:'document.doc';
    
    // Create download link element
    var downloadLink = document.createElement("a");

    document.body.appendChild(downloadLink);
    
    if(navigator.msSaveOrOpenBlob ){
        navigator.msSaveOrOpenBlob(blob, filename);
    }else{
        // Create a link to the file
        downloadLink.href = url;
        
        // Setting the file name
        downloadLink.download = filename;
        
        //triggering the function
        downloadLink.click();
    }
    
    document.body.removeChild(downloadLink);
}

						'location': location_name,
						'nonbranch_location': nonbranch_location_name,
						'is_bookclub': is_bookclub,
						'is_bookmobile': is_bookmobile,
						'bookcover_images': [`<img src="${bookcover_url}" alt="book cover for this book club" />`],
						'time_bookclub': day_of_week + 's at ' + time_str + '<br>',
						'dates_bookmobile': ['<div>' + month + ' ' + day_num + '</div>'],
						'time_bookmobile': day_of_week + 's at ' + time_str + '<br>',
						'ages_str': ages_str,
						'title': title,
						'description': description,
						'reg_required_str': reg_required_str,
						'cancelled': (is_cancelled ? '[CANCELLED]' : ''),
						'dates': ['<div>' + days_of_week[day_of_week] + '., ' + month + ' ' + day_num + ', ' + time_str + '</div>'],
						'dates_bookclub': [month + ' ' + day_num + ', <i>' + bookclub_title + '</i>'
							+ (typeof(bookclub_author)!== undefined && bookclub_author ? ' by ' + bookclub_author : '')
							+ '<br>'],
						'date_objects': [event_start_datetime]
					}
				} else {
					if (event_blocks[location_name][ages_str][title].description !== description) {
						event_blocks[location_name][ages_str][title].description += '<div>' + month + ' ' + day_num + ': ' + description + '</div>';
					}
					event_blocks[location_name][ages_str][title].dates.push('<div>' + days_of_week[day_of_week] + '., ' + month + ' ' + day_num + ', ' + time_str + '</div>');
					event_blocks[location_name][ages_str][title].bookcover_images.push(`<img src="${bookcover_url}" alt="book cover for this book club" />`);
					event_blocks[location_name][ages_str][title].dates_bookclub.push(month + ' ' + day_num + ', <i>' + bookclub_title + '</i>'
						+ (typeof(bookclub_author)!== undefined && bookclub_author ? ' by ' + bookclub_author : '')
						+ '<br>');
					event_blocks[location_name][ages_str][title].dates_bookmobile.push(month + ' ' + day_num + '<br>');
					event_blocks[location_name][ages_str][title].date_objects.push(event_start_datetime);
				}

				//QUICK HACK: Calendar List
				if (typeof calendar_list[event_start_datetime] === 'undefined') {
					calendar_list[event_start_datetime] = new Array();
				}
				calendar_list[event_start_datetime].push('<div>' + days_of_week[day_of_week] + '., ' + month + ' ' + day_num + ' - ' + ages_str + ' - ' + title + ' @ ' + time_str);

			} //end if (filter_location_code === 'ALL_ADULT_NONBOOKDISCUSSIONS')
			
			
		}); //end foreach event_ids
	}); //end foreach json_responses


	//-----------------------------------
	//-- SORT, LOOP AND DISPLAY EVENTS --
	//-----------------------------------

	//sort event blocks by location
	const event_blocks_ordered = Object.keys(event_blocks).sort().reduce(
		(obj, key) => { 
			obj[key] = event_blocks[key]; 
			return obj;
		}, 
		{}
	);


	//FOR 'ALL_ADULT', sort by event type first
	
	
	//***TODO: SORT BY TITLE INSTEAD, don't display event type
	
	
	if (multibranch_display_choices.includes(filter_location_code)) {

		//loop through multi-layer array, building the output string
		//- locations come first
		for (const [type_key, type_name] of Object.entries(event_blocks_ordered)) {
			//html += `<h1>${type_key}</h1>`;
			
			//sort this event types's age groups in custom order
			const age_groups_ordered = Object.keys(type_name).sort(sort_age_groups).reduce(
			  (obj, key) => { 
				obj[key] = type_name[key]; 
				return obj;
			  }, 
			  {}
			);

			//loop through age groups
			for (const [age_key, age_group] of Object.entries(age_groups_ordered)) {
				for (const [event_key, event] of Object.entries(age_group)) {
					//build event output with all dates joined in the correct place
					//- summarize multiple dates into a range
					//TODO: remove date from array as pattern is found, so we can repeat the process with a new first date; e.g. first find "Mondays", then find "Wednesdays", etc.
					var temp_date = event.date_objects[0];

					//use our DateTimeFormat object
					const dt_temp = DTF.formatToParts(temp_date);
					first_month = months[parseInt(dt_temp[2].value)-1].AP; //formatted for AP style
					first_day_num = dt_temp[4].value;

					var date_range_str = '';
					temp_end_date = '';
					range_closed = 0;
					for (var i = 1; i < event.date_objects.length; i++) {
						temp_date.setDate(temp_date.getDate() + 7);
						if ((range_closed==0) && (event.date_objects[i].getTime() == temp_date.getTime())) {
							temp_end_date = event.date_objects[i];
						} else {
							range_closed = 1;
							break;
						}
					}
					//only make range if more than 2 events (i>2) OR if all events are in range
					if (i>2 && 
						(range_closed == 1 || 
							(i == event.date_objects.length
							&& temp_end_date!='')
						)
					) {
						//use our DateTimeFormat object
						const dt_temp_end = DTF.formatToParts(temp_end_date);
						month = months[parseInt(dt_temp_end[2].value)-1].AP; //formatted for AP style
						day_num = dt_temp_end[4].value;
						day_of_week = dt_temp_end[0].value;
						start_time = `${dt_temp_end[6].value}:${dt_temp_end[8].value} ${dt_temp_end[10].value}`;

						date_range_str = `${day_of_week}s, ${first_month} ${first_day_num} - ${month} ${day_num}, ${start_time}`;
					}
					
					if (event.is_bookclub) {
						if (!event.cancelled) {
							html += `
								<h2>${event.location}</h2>
								<p style="font-size:13px;">
								` + `<p style="font-size:16px; font-weight:bold">${event.title}</p>
								` + `<p>${event.time_bookclub}</p>
								<p>` + event.dates_bookclub.join('') + `</p>
								` + (event.location_details ? `(Details: ${event.location_details})` : '') + `${event.reg_required_str}
								</p>
								` + (hide_bookcovers==='true' ? '' : event.bookcover_images) + `
							`;
						}
					} else {
						html += `
							<p style="font-size:13px;">
								${event.cancelled} <span style="font-size:16px; font-weight:bold">${event.title}</span>
							` + (hide_descriptions==='true' ? '' : `<div>${event.description}</div>`) + `
							` + (hide_dates==='true' ? '' : event.dates.join('') ) + `
							` + (event.location_details ? `(Details: ${event.location_details})` : '') + `
							` + (hide_dates==='true' ? '' : `<p>${event.reg_required_str}</p>`) + `
							</p>
							<br>
						`;
					}
				}
			}
		}

	} else {
	
		//loop through multi-layer array, building the output string
		//- locations come first
		for (const [location_key, location_name] of Object.entries(event_blocks_ordered)) {
			html += `
				<h1>${location_key}</h1>
			`;
			//sort this location's age groups in custom order
			const age_groups_ordered = Object.keys(location_name).sort(sort_age_groups).reduce(
			  (obj, key) => { 
				obj[key] = location_name[key]; 
				return obj;
			  }, 
			  {}
			);

			//loop through age groups
			for (const [age_key, age_group] of Object.entries(age_groups_ordered)) {
				html += `
				<h3>For ${age_key}</h3>
				`;
				for (const [event_key, event] of Object.entries(age_group)) {
					//build event output with all dates joined in the correct place
					//- summarize multiple dates into a range
					//TODO: remove date from array as pattern is found, so we can repeat the process with a new first date; e.g. first find "Mondays", then find "Wednesdays", etc.
					var temp_date = event.date_objects[0];

					//use our DateTimeFormat object
					const dt_temp = DTF.formatToParts(temp_date);
					first_month = months[parseInt(dt_temp[2].value)-1].AP; //formatted for AP style
					first_day_num = dt_temp[4].value;

					var date_range_str = '';
					temp_end_date = '';
					range_closed = 0;
					for (var i = 1; i < event.date_objects.length; i++) {
						temp_date.setDate(temp_date.getDate() + 7);
						if ((range_closed==0) && (event.date_objects[i].getTime() == temp_date.getTime())) {
							temp_end_date = event.date_objects[i];
						} else {
							range_closed = 1;
							break;
						}
					}
					//only make range if more than 2 events (i>2) OR if all events are in range
					if (i>2 && 
						(range_closed == 1 || 
							(i == event.date_objects.length
							&& temp_end_date!='')
						)
					) {
						//use our DateTimeFormat object
						const dt_temp_end = DTF.formatToParts(temp_end_date);
						month = months[parseInt(dt_temp_end[2].value)-1].AP; //formatted for AP style
						day_num = dt_temp_end[4].value;
						day_of_week = dt_temp_end[0].value;
						start_time = `${dt_temp_end[6].value}:${dt_temp_end[8].value} ${dt_temp_end[10].value}`;

						date_range_str = `${day_of_week}s, ${first_month} ${first_day_num} - ${month} ${day_num}, ${start_time}`;
					}
					
					if (event.is_bookclub) {
						if (!event.cancelled) {
							html += `
								<h2>${event.location}</h2>
								<p style="font-size:13px;">
								` + `<p style="font-size:16px; font-weight:bold">${event.title}</p>
								` + `<p>${event.time_bookclub}</p>
								<p>` + event.dates_bookclub.join('') + `</p>
								` + (event.location_details ? `(Details: ${event.location_details})` : '') + `${event.reg_required_str}
								</p>
								` + (hide_bookcovers==='true' ? '' : event.bookcover_images) + `
							`;
						}
					} else if (event.is_bookmobile) {
						html += `
							<p style="font-size:13px;">
								${event.cancelled} <span style="font-size:16px; font-weight:bold">${event.title}</span>
							` + (event.nonbranch_location ? `<p>Location: ${event.nonbranch_location}</p>` : '') + `
							` + `<p>${event.time_bookmobile}</p>
							` + (hide_descriptions==='true' ? '' : `<div>${event.description}</div>`) + `
							` + (hide_dates==='true' ? '' : event.dates_bookmobile.join('') ) + `
							` + (event.location_details ? `(Details: ${event.location_details})` : '') + `
							` + (hide_dates==='true' ? '' : `<p>${event.reg_required_str}</p>`) + `
							</p>
							<br>
						`;
					} else {
						html += `
							<p style="font-size:13px;">
								${event.cancelled} <span style="font-size:16px; font-weight:bold">${event.title}</span>
							` + (hide_dates==='true' ? '' : (date_range_str!='' ? `<div><b>${date_range_str}</b></div>` : '') ) + `
							` + (hide_dates==='true' ? '' : event.dates.join('') ) + `
							` + (event.nonbranch_location ? `Location: ${event.nonbranch_location}` : '') + `
							` + (event.location_details ? `(Details: ${event.location_details})` : '') + `
							` + (hide_descriptions==='true' ? '' : `<div>${event.description}</div>`) + `
								<div>${event.reg_required_str}</div>
							</p>
							<br>
						`;
					}
				}
			}
		}

	}



	//display event output
	document.getElementById(div_id).insertAdjacentHTML('beforeend', 
		'<h1>' + filter_location_name + '</h1>'
		+ html
	);

	//print Calendar List
	html_calendar_list = '<h3>Calendar List</h3><p style="font-size:13px;">';
	for (const [cal_item_key, cal_item_name] of Object.entries(calendar_list)) {
		html_calendar_list += '<div>' + cal_item_name + '</div>';
	}
	document.getElementById('events_excel').insertAdjacentHTML('beforeend', html_calendar_list);

	//print sorted list of titles
	all_events = '<h3>All Events in This Timeframe</h3><div>(Paste into Excel)</div><p>' + [...all_titles].sort().join('<br>');

	document.getElementById('events_excel').insertAdjacentHTML('beforeend', all_events);
	branches_done++;

}


</script>
